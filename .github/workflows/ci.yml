name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  # inventory 守护必须在真实 ComfyUI 环境跑（Codex PR审 #2）：否则 test_gating_inventory.py
  # 因 import 失败而静默 skip，schema-drift 守护形同虚设。此 job 强制 COMFYUI_REQUIRE_INVENTORY=1，
  # import 失败即 FAIL。注：ComfyUI 未 pin（用 master），若上游结构/认证字段漂移导致 FAIL，
  # 那正是本守护要暴露的信号；maintainer 可改为 pin 到目标 ComfyUI 版本。
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout ComfyUI
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          path: comfyui-src

      - name: Install bridge + ComfyUI (cpu torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # torch 全家同源 cpu 版（必须含 torchvision/torchaudio，否则 requirements 会按默认装
          # 不匹配版本导致 "operator torchvision::nms does not exist"）。放在 requirements 前，
          # requirements 的无 pin torch* 即被满足跳过。
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r comfyui-src/requirements.txt

      - name: Inventory guard (enforced, no silent skip)
        env:
          COMFYUI_PATH: ${{ github.workspace }}/comfyui-src
          COMFYUI_REQUIRE_INVENTORY: "1"
        run: pytest tests/test_gating_inventory.py -v
